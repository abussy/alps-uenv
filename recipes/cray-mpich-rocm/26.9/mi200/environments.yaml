gcc-env:
  compiler: [gcc]
  network:
      mpi: cray-mpich@8.1.32+rocm
      specs: [ 'libfabric@1.22.0 +rocm' ]
  unify: true
  specs:
  - cray-mpich@8.1.32+rocm
  variants:
  - amdgpu_target=gfx90a
  - amdgpu_target_sram_ecc=gfx90a
  views:
    default:
      link: roots
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
